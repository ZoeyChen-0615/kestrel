[project]
name = "kestrel"
version = "0.1.0"
description = "A compact tool-using LLM agent: ReAct loop, tool registry, hybrid-retrieval memory, context compaction, MCP, skills, sub-agents, tracing and evals."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "mcp>=1.9,<2",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-timeout>=2.2"]

[project.scripts]
kestrel = "kestrel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kestrel"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 60
testpaths = ["tests"]
pythonpath = ["src"]
